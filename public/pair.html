<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="https://imagetourl.cloud/k94oc0zd.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlphaTekx | PAIRING CODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2ff;
            --text: #ffffff;
            --text-light: #e0e0e0;
            --background: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: var(--transition); }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .home-btn {
            position: fixed; top: 1.5rem; right: 1.5rem;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            color: white; padding: 0.8rem 1.5rem; border-radius: 30px;
            font-weight: 600; text-decoration: none; border: 1px solid var(--glass-border);
            z-index: 100; display: flex; align-items: center; gap: 0.5rem;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%; max-width: 500px; text-align: center;
            border: 1px solid var(--glass-border);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }

        h1 { color: var(--primary); margin-bottom: 1rem; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

        p { color: var(--text-light); margin-bottom: 2rem; font-size: 0.9rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--primary); }

        .input-container { position: relative; margin-bottom: 1.5rem; }

        input[type="text"] {
            width: 100%; padding: 15px 15px 15px 45px;
            border: 1px solid var(--glass-border);
            border-radius: 12px; background: rgba(0, 0, 0, 0.2);
            color: white; font-size: 1rem;
        }

        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .btn {
            background: var(--primary); color: #000; padding: 15px;
            border: none; border-radius: 12px; cursor: pointer;
            font-size: 1rem; font-weight: 700; width: 100%;
            margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4); }

        #result { 
            margin-top: 1.5rem; padding: 1.5rem; border-radius: 16px; display: none;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
        }

        #pair-code { font-size: 2rem; font-weight: 700; color: var(--primary); margin: 1rem 0; letter-spacing: 4px; }

        .copy-btn { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; }
        
        .back-btn { 
            background: transparent; color: white; border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .particle { position: absolute; background: var(--primary); border-radius: 50%; opacity: 0.15; animation: float linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh); } 100% { transform: translateY(-10vh); } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="https://whatsapp.com/channel/0029Vb8wyGk1iUxdoi0WOA1U" class="home-btn">
        <i class="fab fa-whatsapp"></i> Channel
    </a>
    
    <div class="container">
        <h1>AlphaTekx</h1>
        <p>Enter your WhatsApp number without + sign</p>
        
        <div class="form-group">
            <label for="phone-number">Phone Number</label>
            <div class="input-container">
                <i class="fas fa-comment" style="position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--primary);"></i>
                <input type="text" id="phone-number" placeholder="e.g., 234xxxxxxxx" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="error-message" id="error-message" style="display:none; color: #ff4d4d; margin-bottom:10px;">Please enter a valid phone number</div>
        </div>
        
        <button id="submit" class="btn">
            <span id="btn-text">GET CODE</span>
            <span id="btn-spinner" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>

        <a href="/qr" id="qr-btn" class="btn" style="background:transparent; border:1px solid var(--primary); color:var(--primary); display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">
            QR CODE
        </a>
        
        <div id="result">
            <p>Your pairing code is:</p>
            <div id="pair-code"></div>
            <div class="action-buttons">
                <button id="copy-btn" class="copy-btn">COPY CODE</button>
                <a href="./" class="back-btn" style="display:block; text-decoration:none; text-align:center;">BACK</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 15 : 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 10 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        const submitButton = document.getElementById('submit');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();
            if (!validatePhoneNumber(phoneNumber)) { errorMessage.style.display = 'block'; return; }
            errorMessage.style.display = 'none';
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            submitButton.disabled = true;
            try {
                const { data } = await axios.get(`/code?number=${phoneNumber}`);
                pairCodeDiv.textContent = data.code || "ERROR";
                resultDiv.style.display = 'block';
            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
            } finally {
                btnText.style.display = 'inline-block';
                btnSpinner.style.display = 'none';
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(pairCodeDiv.textContent).then(() => {
                alert("Code copied!");
            });
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (errorMessage.style.display === 'block') errorMessage.style.display = 'none';
        });
    </script>
</body>
                </html>
